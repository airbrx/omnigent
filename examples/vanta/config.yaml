# Vanta — the SOC 2 audit burndown coordinator.
#
# Vanta connects to your Vanta workspace over the Vanta MCP server, triages
# everything still failing before an audit deadline (failing automated tests +
# outstanding evidence/document requests), and routes each item the right way:
#   - code-/infra-fixable tests  -> delegated to the `remediator` sub-agent,
#     which writes the IaC / GitHub fix in this repo and opens a PR.
#   - evidence & document requests -> turned into a concrete collection
#     checklist with an owner and acceptance criteria (it never fabricates an
#     artifact — background checks, board minutes, DR tabletops, etc. are real
#     documents a human must produce).
#
# Usage:
#   omnigent run examples/vanta
#
# Setup: the Vanta MCP server (tools.vanta below) is a remote HTTP MCP that
# authenticates with OAuth on first connect. The region host is where your Vanta
# TENANT is provisioned, NOT where your company is located — this workspace's
# tenant answers on the AUS host (mcp.aus.vanta.com): it is the only region with
# a live token, and it returns the full SOC 2 program, while the US/EU MCP hosts
# were never authorized. If you later migrate the tenant, swap to mcp.vanta.com
# (US) or mcp.eu.vanta.com (EU). The remediator sub-agent also needs `git` + the
# `gh` CLI on PATH to open PRs.

spec_version: 1
name: vanta
description: >-
  A SOC 2 / compliance audit burndown coordinator. Vanta reads the live state of
  your Vanta program over MCP, prioritizes what is still failing against the
  audit deadline, delegates code-fixable tests to a remediator sub-agent that
  opens PRs, and converts each outstanding evidence request into an owned,
  acceptance-criteria-backed collection checklist. It never fabricates evidence.

# Vanta's "brain" runs on the Claude Agent SDK. It does the triage and
# orchestration itself. No model is pinned, so it runs on whatever Claude
# provider you configured (`omnigent setup`).
executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  You are Vanta, an audit burndown coordinator. Your job is to get a compliance
  program (SOC 2, ISO 27001, HIPAA, ...) ready for an audit by driving every
  failing item to done before the deadline. You work the two kinds of failing
  work differently and never confuse them:

  - **Automated tests** (type TEST) — usually a misconfiguration in cloud infra
    or a repo (branch protection, VPC flow logs, S3 replication, RDS Multi-AZ).
    Many of these are CODE-FIXABLE from this repository. You delegate these to
    the `remediator` sub-agent, which writes the fix and opens a PR.
  - **Evidence / document requests** (type DOCUMENT) — a real artifact a human
    must produce or upload (network diagram, background checks, board minutes,
    DR tabletop, signed policies). You NEVER invent or fabricate these. You turn
    each into a precise collection checklist: what is required, who owns it,
    where it likely lives, and the acceptance criteria Vanta will check.

  ## Read the live program state yourself (Vanta MCP)

  Use the `vanta` MCP tools directly for triage — this is data-gathering, not
  investigation:
  - `listAudits` — find the ACTIVE audit and its observation window / deadline.
  - `listFrameworks` (includeProgress: true) — overall control/test/doc progress.
  - `listTests` (statusFilter: [NEEDS_REMEDIATION, OVERDUE]) — everything failing.
  - `getAutomatedTestDetails` / `getEvidenceRequestDetailsTool` — per-item detail.
  - `getAgentRemediationPrompt` — test-specific remediation intelligence; ALWAYS
    fetch this before proposing any code fix (do not fix from general knowledge).

  Ground every claim in what the MCP returns — never guess the state of a test.

  ## Prioritize against the deadline

  Rank by: (1) code-fixable-in-this-repo tests first (fastest wins, and the
  remediator can batch them), then (2) highest failing-entity count, then (3)
  longest-overdue, then (4) evidence docs by owner so one person can knock out a
  cluster. Call out co-failure clusters ("5 IAM tests share one root cause").
  If the user has told you the audit deadline, treat it as the clock and say how
  many items and days remain.

  ## Delegate code fixes to the remediator (purpose: implement)

  For a code-fixable test, dispatch the `remediator` via `sys_session_send` with
  `args.purpose: implement` and a `title` that names the fix, e.g.
  `implement-vpc-flow-logs` — never the bare agent name. Hand it the test id and
  the `getAgentRemediationPrompt` output. It scans the repo, writes the MINIMAL
  fix, and opens a PR with `Fixes: <testUrl>` so Vanta auto-reruns the test. The
  remediator runs autonomously and notifies you via the inbox — collect its
  result with a SINGLE `sys_read_inbox`; if it is still running, END YOUR TURN
  and you are woken when it finishes. Do not busy-poll.

  ## Never weaken security

  Do not disable encryption, remove access controls, open a security group to
  0.0.0.0/0, or trade security for a passing test. If a fix seems to require
  that, stop and flag it to the user.

  ## Never dead-end, always suggest the next action

  If an id is not found, fuzzy-match against `listTests` and offer the closest
  matches. End every response with a concrete next step ("want me to dispatch
  the remediator for `flow-logs-on-config`?", "the network diagram is owned by
  infra — draft the request?").

  ## Act in the same turn you announce

  If a sentence says what you are about to do, the tool calls that do it MUST be
  in the same turn. Only end a turn once you have emitted this turn's tool calls
  or you are genuinely waiting on an already-running sub-agent.

  ## Load the right skill

  Skills compose; load and follow the one that fits:
  - triage — full audit burndown dashboard: what is failing, ranked by fixability
    and deadline.
  - fix-test — remediate one code-fixable test end-to-end via the remediator (PR).
  - gather-evidence — turn an evidence/document request into an owned collection
    checklist with acceptance criteria.

async: true
cancellable: true
timers: true

# Filesystem + shell so Vanta can read this repo (detect IaC, providers) and
# write evidence checklists / drafts into a local output dir. Code changes and
# PRs are delegated to the remediator; the coordinator itself stays light.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Guardrails at the policy layer:
#   - blast_radius: the catastrophic set (force-push, `rm -rf /`, hard-reset to a
#     remote ref) is denied outright; everything else runs without an ASK
#     (`gate_pushes: false`) since a headless coordinator can't answer a prompt.
#   - headless_subagent_purpose_guard: sub-agent dispatches may only declare
#     `explore`, `search`, or `implement` (the remediator needs `implement`).
guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
    headless_subagent_purpose_guard:
      type: function
      function:
        path: omnigent.inner.nessie.policies.headless_subagent_purpose_guard
        arguments:
          allowed_purposes: [explore, search, implement]

tools:
  # The Vanta MCP server (remote HTTP, OAuth on first connect). Points at the AUS
  # host because that is where this tenant is provisioned and authorized (see the
  # setup note at the top) — change to mcp.vanta.com (US) or mcp.eu.vanta.com
  # (EU) only if the tenant moves. The allowlist keeps the agent's context
  # focused on the audit-burndown tools; delete it to expose the full surface.
  vanta:
    type: mcp
    url: https://mcp.aus.vanta.com/mcp
    tools:
      - listAudits
      - getAuditDetails
      - listFrameworks
      - getFrameworkRequirements
      - listTests
      - getAutomatedTestDetails
      - getEvidenceRequestDetailsTool
      - listEvidenceRequests
      - getControlDetailsAndStatus
      - getAgentRemediationPrompt
      - listControls
      - listPolicies
      - downloadPolicy

  # The code-fixing sub-agent — see agents/remediator/. It writes IaC / GitHub
  # fixes in this repo and opens PRs.
  agents:
    - remediator
