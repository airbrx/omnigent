name: Maintainer Approval

# Gates merge on a maintainer's approval, except for explicitly trusted automation
# authors. The job *is* the required check: it exits non-zero until approval (or
# a trusted author) is present, and GitHub reports that pass/fail as the
# `Maintainer Approval` status. No commit status is posted (a fork's token
# is read-only, so a `gh api .../statuses` POST would 403), so the check is the
# job result instead.
#
# Trigger is `pull_request_target`, so it runs from main with the base token
# even for fork PRs: it isn't held behind the fork-PR-workflow approval gate
# (reports immediately on open), and the PR-head copy never runs (a malicious PR
# can't weaken the check). Safe because the job checks out only the evaluator
# from main and runs no PR code. The evaluator reads .github/MAINTAINER from
# main's tip (so a PR can't self-grant by adding its author) and queries the API.
#
# `pull_request_target` doesn't fire on reviews, so maintainer-approval-rerun.yml
# + -rerun-run.yml re-run this workflow on an approving review to flip it green.
#
# An approval is carried across later commits only when every push since it was
# made by trusted automation, judged by the authenticated actor of each head's
# `pull_request_target` run (hence `actions: read`), never by the commit email.
#
# The gate is enforced only where it can be satisfied. `.github/MAINTAINER` lists
# the upstream project's maintainers, so in a fork no approver is ever present:
# the check stays red on every push forever and mails a failure to whoever
# pushed. It gates nothing in that state -- it isn't a required check downstream,
# so PRs merge red -- leaving only the noise. A fork that keeps its own roster
# opts back in with the `ENFORCE_MAINTAINER_APPROVAL` repository variable.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  # Don't cancel in-progress: a run cancelled mid-flight leaves the check red.
  group: maintainer-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Maintainer Approval
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Decide whether the gate applies here
        id: applies
        env:
          REPO:     ${{ github.repository }}
          UPSTREAM: omnigent-ai/omnigent
          OPT_IN:   ${{ vars.ENFORCE_MAINTAINER_APPROVAL }}
        run: |
          # The job reports the `Maintainer Approval` check either way, so branch
          # protection always resolves; only enforcement is conditional.
          if [ "$REPO" = "$UPSTREAM" ] || [ "$OPT_IN" = "true" ]; then
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Maintainer Approval not enforced::$REPO keeps no maintainer roster of its own. List approvers in .github/MAINTAINER and set the ENFORCE_MAINTAINER_APPROVAL repository variable to 'true' to turn the gate back on."
          fi

      - name: Check out approval evaluator
        if: steps.applies.outputs.enforce == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          sparse-checkout: .github/scripts/maintainer_approval.py
          sparse-checkout-cone-mode: false

      - name: Require maintainer approval
        if: steps.applies.outputs.enforce == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/maintainer_approval.py \
            --repository "$REPO" \
            --pr-number "$PR" \
            --trusted-author 'omni-resolve-agent[bot]' \
            --trusted-successor 'omni-resolve-agent[bot]'
