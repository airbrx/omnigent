# Start / stop / inspect the omnigent dev box (i-099d66548b496d876).
#
# This is the "wake button": run it from the Actions tab or the GitHub mobile
# app and the box comes back on its own -- omnigent-creds.service re-pulls the
# tokens from Secrets Manager and the lingering omnigent-host user unit
# re-registers with omnigent.airbrx.ai. No login, nothing to restore.
#
# Progress is deliberate: every phase writes to the job summary AND emits a
# ::notice, so a phone shows a live step list rather than an opaque spinner.
#
# AWS auth is OIDC (no stored keys), reusing the omnigent-github-deploy role
# that the server deploy already uses. That role trusts ONLY this repo on the
# omnigent-airbrx-server / 2026-summer-internship branches, so this workflow
# cannot be run from a fork or a random branch.
name: Dev box power

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        default: start
        options: [start, stop, status]

# Deliberately manual-only: no `schedule:` trigger.
#
# Auto-stop is the in-box idle watcher (60 min, /etc/omnigent/devbox-idle.conf),
# which needs no AWS credentials and cannot fail at an auth step. A cron here
# would also be broken by construction: GitHub runs scheduled workflows only
# from the DEFAULT branch (main), while the omnigent-github-deploy OIDC role
# trusts only omnigent-airbrx-server / 2026-summer-internship -- so it would
# fail nightly at the credentials step.

concurrency:
  group: devbox-power
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-099d66548b496d876

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve action
        id: act
        run: |
          set -euo pipefail
          # The dispatch input is required and defaults to "start", so this
          # fallback should be unreachable. It resolves to the read-only
          # "status" on purpose: if the expression ever does come back empty,
          # the failure mode must not be silently powering the box off.
          ACTION="${{ github.event.inputs.action || 'status' }}"
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "### Dev box: \`${ACTION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Dev box::action=${ACTION}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::724412576111:role/omnigent-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Current state
        id: before
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].State.Name' --output text)
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "- before: \`${STATE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Before::${STATE}"

      - name: Start
        if: steps.act.outputs.action == 'start' && steps.before.outputs.state != 'running'
        run: |
          set -euo pipefail
          echo "::group::starting instance"
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          echo "- [1/3] start requested" >> "$GITHUB_STEP_SUMMARY"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "- [2/3] instance running" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Progress::instance running; waiting for SSM"
          echo "::endgroup::"

          # SSM Online is the proxy for "boot finished and the agent is up".
          echo "::group::waiting for SSM agent"
          for i in $(seq 1 40); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[].PingStatus' --output text 2>/dev/null || true)
            [ "$PING" = "Online" ] && break
            echo "  ...${i}/40 (ping=${PING:-none})"
            sleep 6
          done
          echo "::endgroup::"
          [ "$PING" = "Online" ] || { echo "::error title=Wake failed::SSM never came Online"; exit 1; }
          echo "- [3/3] SSM online" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop
        if: steps.act.outputs.action == 'stop' && steps.before.outputs.state == 'running'
        run: |
          set -euo pipefail
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
          echo "- [1/2] stop requested" >> "$GITHUB_STEP_SUMMARY"
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          echo "- [2/2] stopped; compute billing halted" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Stopped::compute billing halted, volume retained"

      - name: Report
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].State.Name' --output text)
          echo "- after: \`${STATE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=After::${STATE}"

          # Only ask the box about itself when it is actually up.
          if [ "$STATE" = "running" ]; then
            CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["devbox-report status"]' \
              --query Command.CommandId --output text)
            for _ in $(seq 1 20); do
              S=$(aws ssm get-command-invocation --command-id "$CID" \
                --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
              case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 3
            done
            OUT=$(aws ssm get-command-invocation --command-id "$CID" \
              --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true)
            {
              echo ""
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
              echo "Open [omnigent.airbrx.ai](https://omnigent.airbrx.ai) and pick host \`omnigent-devbox\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
