<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eva · Outreach workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/airbrx-logo.png" alt="airbrx" />
        <span class="agent"
          ><img src="assets/eva-portrait.png" alt="" /> Eva</span
        >
      </div>
      <nav id="tabs" role="tablist" aria-label="Workspace"></nav>
      <div id="actions" class="actions">
        <span id="freshness" class="muted small"></span>
        <button id="refresh" class="primary" type="button">
          Refresh pipeline
        </button>
      </div>
    </header>

    <div id="notice" class="notice" role="status" hidden></div>

    <div id="workspace" class="workspace">
      <section id="home" class="home" aria-label="Eva's read of the pipeline">
        <!-- Hidden until Eva has read something, so no row of zeros flashes on load. -->
        <section id="kpis" class="kpis" aria-label="Summary" hidden>
          <div class="kpi">
            <div class="label">In the pool</div>
            <div class="value" id="kpi-pool">&ndash;</div>
            <div class="note">claimable leads</div>
          </div>
          <div class="kpi">
            <div class="label">Yours</div>
            <div class="value" id="kpi-mine">&ndash;</div>
            <div class="note">owned or claimed</div>
          </div>
          <div class="kpi">
            <div class="label">Drafts</div>
            <div class="value" id="kpi-drafts">&ndash;</div>
            <div class="note">seen by Eva</div>
          </div>
          <div class="kpi">
            <div class="label">Awaiting approval</div>
            <div class="value" id="kpi-review">&ndash;</div>
            <div class="note">in review</div>
          </div>
        </section>

        <div
          id="views"
          class="views"
          role="group"
          aria-label="What Eva has read"
          hidden
        >
          <button type="button" data-view="pipeline">
            Pipeline <b id="nav-pool">&ndash;</b>
          </button>
          <button type="button" data-view="mine">
            My leads <b id="nav-mine">&ndash;</b>
          </button>
          <button type="button" data-view="drafts">
            Drafts and approvals <b id="nav-drafts">&ndash;</b>
          </button>
        </div>

        <section class="content" aria-live="polite">
          <div id="detail" class="card detail" hidden></div>
          <div id="view"></div>
        </section>

        <p class="footnote">
          <span class="dot"></span> Eva drafts, you send. She never sends and
          never approves her own drafts; approval and mark sent happen in the
          outreach app.
          <a id="outreach-link" class="outlink" href="/eva/app/leads"
            >Open the lead list</a
          >
        </p>
      </section>

      <section id="frames" class="frames" hidden></section>

      <button id="dock-rail" class="dock-rail" type="button" hidden>
        <img src="assets/eva-portrait.png" alt="" />
        <span>Ask Eva</span>
      </button>

      <section id="chat" class="chat card" aria-label="Chat with Eva">
        <div class="chat-head">
          <div class="section-title">Ask Eva</div>
          <button
            id="collapse"
            type="button"
            class="chip"
            aria-label="Collapse chat"
            hidden
          >
            Hide
          </button>
        </div>
        <ol id="messages" class="messages"></ol>
        <form id="composer">
          <div id="context" class="context" hidden>
            <span id="context-label" class="badge accent"></span>
            <button id="context-remove" type="button" class="link">
              Don't include this page
            </button>
          </div>
          <textarea
            id="input"
            rows="3"
            aria-label="Message Eva"
            placeholder="Ask Eva to find, qualify or draft. Enter sends, Shift+Enter adds a line."
          ></textarea>
          <div class="composer-row">
            <button id="cancel" type="button" class="secondary" hidden>
              Stop
            </button>
            <button id="send" type="submit" class="primary">Send</button>
          </div>
        </form>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
