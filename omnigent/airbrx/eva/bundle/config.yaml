spec_version: 1
name: eva

# Eva is the outreach agent for Airbrx: the second hosted agent on
# omnigent.airbrx.ai, beside Iris.
#
# She is hosted the way Iris is hosted. A binding names an execution host
# (host_id), Eva's turns run on that host, and her MCP client connects from
# there. That is the mechanism, not an accident: the outreach app runs on the
# operator's own Mac at http://127.0.0.1:8000, and a runner on that Mac reaches
# it with no DNS, no certificate and no container anywhere. Iris works the same
# way and has no public hostname either.
#
# What Eva does NOT have is Iris's local-tool apparatus. Every one of Eva's
# tools is a REMOTE MCP tool served by the airbrx-outreach app, so there is no
# vendored Python archive, no sha256 digest, no sys.path extraction and no
# launchd delta. The binding's token_ref names the outreach bearer token the
# host resolves at the point of use; nothing in this file is a credential.
#
# If Eva ever grows a local tool, the vendoring and verification half of Iris's
# apparatus comes back with it. Say so out loud before taking it.

# Her MCP bearer token is per host (resolved on the execution host from the
# binding's token_ref) and must never be in the coordinator's environment. So
# only the runner expands this bundle's ${VAR}s. Without this line the
# coordinator refuses every session create for an unset OUTREACH_MCP_TOKEN,
# and the only workaround is a stand-in or the real token in server.env.
env_expansion: runner

# Brand voice, per the airbrx-branding skill: direct, technical, anti-hype, and
# specific rather than vague. No buzzwords, no "robust" or "seamless", numbers
# where numbers exist. This is the line a person reads next to her name in the
# drawer, beside Iris, so it is the first impression the brand makes here.
description: >-
  Works the airbrx lead list with you. Pulls and qualifies leads, drafts the
  message you will send under your own name, and checks every draft against the
  12 deterministic guardrails before you see it. She does not send, and she does
  not approve her own drafts.

# The omni meta harness: the brain is Omnigent's own executor rather than a
# harness pinned to one vendor, so Eva runs on whatever model provider the
# coordinator is configured with, and smart routing picks per turn. This is the
# same shape polly uses. Iris pins claude_sdk directly; Eva does not, because
# nothing in her tool surface depends on a particular vendor's tool protocol.
executor:
  type: omnigent
  context_window: 200000
  config:
    harness: claude-sdk
    smart_routing_harness: auto

# No `llm:` block on purpose. That block requires an explicit `model`, and
# naming one here would pin Eva to a single model for everybody, which is what
# the omni meta harness above exists to avoid. With it absent, the harness
# resolves whatever provider the coordinator is configured with. Iris pins
# claude-sonnet-4-6; Eva deliberately does not.

skills: none
async: false

# No spawning. Eva is one agent doing one job against a permissioned API, not an
# orchestrator. Registering sys_session_create would give her a way to start
# sessions that the outreach permission model knows nothing about.
spawn: false

tools:
  builtins: []
  timeout: 300
  retry:
    max_retries: 0

  # The airbrx-outreach MCP surface. `contracts/mcp_tools.md` in
  # airbrx/airbrx-outreach fixes these tools (17, plus the four the Scoreboard,
  # LinkedIn and GTM plan pages added on 2026-09-26, plus set_linkedin_post_url
  # from airbrx-outreach#149 on 2026-09-27), their schemas and their
  # permission rules.
  #
  # The URL and the bearer token are expanded from the RUNNER's environment,
  # and for a host-bound session the runner is the execution host. That is the
  # whole reason Eva needs no public hostname: `${OUTREACH_MCP_URL}` is normally
  # http://127.0.0.1:8000/mcp and resolves on the operator's own Mac, exactly as
  # Iris's tools resolve there. No DNS, no certificate, no container on EC2.
  #
  # No credential appears in this file or in the registered bundle.
  #
  # This is an ALLOW LIST rather than a passthrough. Everything absent is
  # unavailable to Eva even if the server advertises it, which is how the
  # boundary is expressed in the spec as well as in the tool layer. Three of
  # the contract's tools are deliberately withheld below.
  outreach:
    type: mcp
    url: ${OUTREACH_MCP_URL}
    headers:
      Authorization: Bearer ${OUTREACH_MCP_TOKEN}
      X-Outreach-Agent: eva
    tools:
      - list_pool
      - list_my_leads
      - get_lead
      - claim_lead
      - release_lead
      - add_lead
      - update_lead_fields
      - save_qualification
      - submit_draft
      - add_comment
      - request_approval
      - log_touch
      - list_guardrails
      - query_analytics
      - record_agent_run
      - list_linkedin_posts
      - record_linkedin_metrics
      - set_linkedin_post_url
      - list_plan_items
      - record_plan_actual

# Withheld from the list above, and the reason is the product's, not Omnigent's:
#
#   approve_draft  Approval is the lead owner's or an admin's and never the
#                  author's. Eva writes drafts, so Eva approving one would
#                  collapse the two roles the approval gate exists to separate.
#
#   mark_sent      Nothing in this system sends anything. A rep sends from their
#                  own client and then records that they did. An agent marking a
#                  draft sent would be recording an event it cannot observe.
#
#   upsert_linkedin_post
#                  It rewrites a post's title, status, dates or copy. Eva only
#                  fills an empty address with set_linkedin_post_url, which the
#                  server refuses for a post that already has one.
#
# The first two refusals are also enforced server-side in the outreach tool
# layer, so for them this list is defence in depth rather than the only thing
# standing there. upsert_linkedin_post is open to any rep on the server, so for
# Eva this list and policy.py are what withhold it.

  # A browser, for one job: reading the analytics of Airbrx's and the founders'
  # own LinkedIn posts. Approved by Abram on 2026-09-26; docs/eva/RUNBOOK.md has
  # the setup.
  #
  # Playwright MCP (Microsoft's @playwright/mcp, pinned 0.0.82), installed as
  # the operator under ~/.eva-playwright on the EXECUTION HOST, in EXTENSION
  # mode (2026-09-27): it drives the operator's own, already signed-in Google
  # Chrome through the "Playwright Extension" (Chrome Web Store id
  # mmlmfjhmonkocbjadbfplnigmagldckm). The dedicated profile it replaces,
  # ~/.eva-linkedin-profile, never got a session, because LinkedIn refuses a
  # sign-in inside an automation-launched Chrome. It is a stdio server the
  # runner spawns, so it lives and dies on the host that runs her turn, and its
  # tools reach her CLI through the one `omnigent` server as `browser__<tool>`,
  # which keeps --strict-mcp-config intact.
  #
  # `sh -c` so $HOME resolves on that host (spec args are not expanded) and so
  # the extension token can be read from the host's login keychain at spawn.
  # The token is the extension's own (its status page shows it); it lives in
  # the keychain item `eva-playwright-extension-token`, never in this file, and
  # an explicit PLAYWRIGHT_MCP_EXTENSION_TOKEN in the spawn environment wins.
  # With no token the server REFUSES TO START (exit 78) rather than fall back
  # to the extension's tab picker: the picker would let an existing tab of the
  # operator's, with its own history, become hers, and it would hang her turn
  # until someone clicked. With the token, the extension connects without a
  # prompt and hands her the fresh tab it opened for the handshake, inside a
  # "Playwright" tab group of her own. She sees only the tabs in that group;
  # the operator's other tabs are never attached.
  #
  # Five fences, outermost first:
  #   1. this allow list: five read tools, no click, type, key, form, evaluate,
  #      run code, upload, screenshot, tab, cookie or network tool;
  #   2. tool_boundary (policy.py): navigate only to https://www.linkedin.com/,
  #      no argument outside each tool's named few, snapshot never to a file;
  #   3. the token-only start: her own new tab in her own group, never one of
  #      the operator's;
  #   4. --allowed-origins: requests from her tabs go only to linkedin.com and
  #      its licdn.com asset hosts. In extension mode this is the same
  #      context.route() interception as before, sent to her attached tabs
  #      through chrome.debugger; Playwright says it is not a security boundary
  #      and does not cover redirects, which is why 2 exists;
  #   5. --no-webmcp: a page cannot register tools of its own.
  # No --user-data-dir, --headless or --sandbox: in extension mode Playwright
  # launches nothing, and a --user-data-dir would point the connect page at a
  # profile without the extension.
  browser:
    type: mcp
    command: /bin/sh
    args:
      - -c
      - >-
        PATH="$PATH:/usr/local/bin:/opt/homebrew/bin";
        PLAYWRIGHT_MCP_EXTENSION_TOKEN="${PLAYWRIGHT_MCP_EXTENSION_TOKEN:-$(/usr/bin/security
        find-generic-password -a "$USER" -s eva-playwright-extension-token -w
        2>/dev/null)}";
        if [ -z "$PLAYWRIGHT_MCP_EXTENSION_TOKEN" ]; then
        echo "eva browser: no Playwright Extension token (keychain item
        eva-playwright-extension-token); refusing to start" >&2;
        exit 78;
        fi;
        export PLAYWRIGHT_MCP_EXTENSION_TOKEN;
        exec "$HOME/.eva-playwright/node_modules/.bin/playwright-mcp"
        --extension
        --browser chrome
        --output-dir "$HOME/.eva-playwright/output"
        --output-max-size 20000000
        --allowed-origins "https://www.linkedin.com;*.licdn.com"
        --no-webmcp
        --image-responses omit
    tools:
      - browser_navigate
      - browser_snapshot
      - browser_wait_for
      - browser_navigate_back
      - browser_close

guardrails:
  policies:
    eva-tool-boundary:
      type: function
      on: [tool_call]
      # Same routing reason as Iris's boundary: named through omnigent so it is
      # importable on whichever process dispatches the tool call.
      function: omnigent.airbrx.eva.policy.tool_boundary
